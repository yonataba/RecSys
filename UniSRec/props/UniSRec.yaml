model: UniSRec

# ===== REQUIRED ARCH PARAMS (must not be None) =====
hidden_act: gelu
initializer_range: 0.02
hidden_size: 300
embedding_size: 300
plm_size: 768
n_layers: 2
n_heads: 2
inner_size: 256
hidden_dropout_prob: 0
attn_dropout_prob: 0
layer_norm_eps: 1e-12

# ===== UniSRec-specific =====
n_exps: 8
adaptor_layers: [768, 300]
adaptor_dropout_prob: 0.05
temperature: 0.07
item_drop_ratio: 0.1
lambda: 0.02
loss_type: CE
train_stage: transductive_ft
plm_suffix: None



# ===== data =====
load_col:
  inter: [user_id, item_id, timestamp]

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

train_neg_sample_args: ~

# ===== training =====
train_batch_size: 512
epochs: 100
stopping_step: 15
plm_suffix: None
plm_suffix_aug: None

device: cuda