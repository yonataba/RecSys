
model: UniSRec
train_stage: transductive_ft

plm_size: 768
hidden_size: 768
embedding_size: 768

n_layers: 2
n_heads: 4
inner_size: 3072
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
hidden_act: gelu
layer_norm_eps: 1e-12
initializer_range: 0.02

n_exps: 8
adaptor_layers: [768, 768]
adaptor_dropout_prob: 0.2
temperature: 0.07

loss_type: CE

plm_suffix: None
plm_suffix_aug: None

alias_of_item_id: ~

item_drop_ratio: 0.0
lambda: 0.0
